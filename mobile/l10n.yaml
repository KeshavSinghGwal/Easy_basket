arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false

# Fails the build listing any key present in app_en.arb but missing from
# app_hi.arb / app_pa.arb, so a forgotten translation is caught here rather
# than as a blank widget in a language nobody on the team reads.
untranslated-messages-file: l10n_untranslated.txt
