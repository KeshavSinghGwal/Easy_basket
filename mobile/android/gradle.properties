org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Pub cache lives on C:\ while the project lives on D:\ — Kotlin's incremental
# compiler can't compute relative paths across drives on Windows and crashes
# (see JetBrains KT-50161). Disabling incremental compilation makes the build
# slightly slower but reliable.
kotlin.incremental=false
