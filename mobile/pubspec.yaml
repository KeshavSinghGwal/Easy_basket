name: easy_basket
description: Easy Basket - Instant Grocery Delivery App
publish_to: 'none'
version: 10.0.3+103

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Forms & Validation (optional - not currently used, can be added later)
  # flutter_form_builder: ^9.1.1
  # form_builder_validators: ^9.1.0
  
  # Payments
  razorpay_flutter: ^1.3.0
  
  # Location
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  # location: used only for Location.requestService() — shows the in-app
  # Google Play Services dialog to turn on OS location without leaving the app.
  # geolocator handles everything else (permissions, GPS reads, accuracy).
  location: ^8.0.0
  
  # Maps
  google_maps_flutter: ^2.5.0
  permission_handler: ^11.0.1
  
  # Image Handling
  image_picker: ^1.0.7
  image: ^4.1.3
  
  # Voice Search
  speech_to_text: ^7.3.0

  # Localization — English / Hindi / Punjabi.
  # flutter_localizations supplies the Global*Localizations delegates, which
  # translate Flutter's OWN widget text (date picker, copy/paste menu).
  # Our app strings come from lib/l10n/*.arb via gen_l10n (generate: true below).
  flutter_localizations:
    sdk: flutter

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  google_fonts: ^8.0.2
  share_plus: ^12.0.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  assets:
    - assets/images/
    - assets/icons/
  
  # fonts:
  #   - family: RoundedSans
  #     fonts:
  #       - asset: assets/fonts/RoundedSans-Regular.ttf
  #       - asset: assets/fonts/RoundedSans-Bold.ttf
  #         weight: 700
  # Note: Uncomment above and add font files if you have RoundedSans font

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
